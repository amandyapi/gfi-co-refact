deployment:
  tasks:
    # 1. Définir le chemin de déploiement (le dossier de votre sous-domaine)
    - export DEPLOYPATH=/home/gficonet/develop.gfi-co.net/
    
    # 2. Supprimer les anciens fichiers (optionnel mais conseillé pour éviter les résidus)
    # Attention : Cela supprime tout le contenu du dossier de destination.
    # Commentez ou supprimez cette ligne si vous avez des fichiers importants que vous ne voulez pas écraser.
    # - /bin/rm -rf $DEPLOYPATH
    
    # 3. Copier le contenu du dossier "public" (ou ".") vers le dossier du sous-domaine
    # Selon votre structure, vous aurez peut-être un dossier "public" ou "web" à la racine de votre projet Symfony.
    - /bin/cp -R . $DEPLOYPATH
    
    # 4. Se déplacer dans le dossier de destination
    - cd $DEPLOYPATH
    
    # 5. Installer les dépendances Composer en environnement de développement
    # (ou --no-dev pour la production, mais pour un site de développement c'est bien)
    - /usr/local/bin/php /usr/local/bin/composer install --no-interaction
    
    # 6. (Optionnel) Vider le cache Symfony en environnement de développement
    - APP_ENV=dev php bin/console cache:clear